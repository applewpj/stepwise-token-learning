[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-learning-spectrum"
version = "0.1.0"
description = "Decompose smooth scaling laws into token-level learning events and learning-time spectra (NeurIPS 2026 Spotlight)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Pingjie Wang"},
  {name = "Zechen Hu"},
  {name = "Peiru Yang"},
  {name = "Fu Guo"},
  {name = "Debing Zhang"},
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "scaling laws",
  "learning-time spectrum",
  "language modeling",
  "token loss",
  "learning dynamics",
  "training dynamics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "torch>=2.0",
  "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pyarrow>=14",
]
hf = [
  "huggingface_hub>=0.23",
]
sglang = [
  "sglang>=0.4",
  "transformers>=4.40",
  "datasets>=2.18",
]

[project.scripts]
tokenlearning = "tokenlearning.cli:main"
tokenlearning-run = "tokenlearning.cli:run_main"

[project.urls]
Homepage = "https://applewpj.github.io/stepwise-token-learning/"
Repository = "https://github.com/applewpj/stepwise-token-learning"
Issues = "https://github.com/applewpj/stepwise-token-learning/issues"
Paper = "https://openreview.net/forum?id=THZDVZArRH"
Dataset = "https://huggingface.co/datasets/applewpj/stepwise-token-learning"
Documentation = "https://github.com/applewpj/stepwise-token-learning/tree/main/docs"
Quickstart = "https://colab.research.google.com/github/applewpj/stepwise-token-learning/blob/main/notebooks/quickstart.ipynb"

[tool.setuptools.packages.find]
include = ["tokenlearning*"]
