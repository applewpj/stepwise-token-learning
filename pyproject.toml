[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-learning-spectrum"
version = "0.1.0"
description = "Token learning-time spectrum analysis for scaling curves."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Pingjie Wang"},
  {name = "Zechen Hu"},
  {name = "Peiru Yang"},
  {name = "Fu Guo"},
  {name = "Debing Zhang"},
]
license = {file = "LICENSE"}
keywords = ["scaling laws", "language modeling", "token loss", "learning dynamics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
hf = [
  "huggingface_hub>=0.23",
]
sglang = [
  "sglang>=0.4",
  "transformers>=4.40",
  "datasets>=2.18",
]

[project.scripts]
tokenlearning = "tokenlearning.cli:main"
tokenlearning-run = "tokenlearning.cli:run_main"

[project.urls]
Homepage = "https://github.com/applewpj/token-learning-spectrum"
Repository = "https://github.com/applewpj/token-learning-spectrum"
Issues = "https://github.com/applewpj/token-learning-spectrum/issues"

[tool.setuptools.packages.find]
include = ["tokenlearning*"]
